    <!-- Paints the app's real background the instant the browser has the
         HTML - before the JS bundle loads, parses, or mounts React - so
         there's no flash of stark white ahead of the SplashScreen. Values
         are duplicated from index.css's --background (light/dark), since
         nothing from that stylesheet is available yet at this point. -->
    <style>
      html, body, #root { background-color: hsl(26 100% 97%); }
      html.dark, html.dark body, html.dark #root { background-color: hsl(220 20% 12%); }
    </style>
    <script>
      // Applies the "dark" class before first paint, matching next-themes'
      // own storage key/logic (ThemeProvider in App.tsx), so the background
      // color set above is the *correct* one immediately instead of
      // guessing light and flashing to dark once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
