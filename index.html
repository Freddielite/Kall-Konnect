    <!-- A single static color, not two media-query-tied ones — the app's
         theme (light/dark) is a manual in-app toggle independent of the
         OS-level color-scheme, so a prefers-color-scheme-based theme-color
         can end up mismatched with what's actually on screen (status bar
         stays light while the app itself is dark, or vice versa). Using
         the brand coral instead — the same color as every page's top
         gradient-warm header — means the status bar always blends with
         real on-screen content no matter which theme is active. -->
    <meta name="theme-color" content="#FF9670" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: status bar becomes transparent and page content
         draws underneath it (paired with viewport-fit=cover above and the
         safe-area padding in index.css), instead of "default"'s solid white
         bar. Since the coral header (or the plain background on pages
         without one) already sits at the very top, this makes the status
         bar show whatever's actually there — never a mismatched white
         strip — which is the effect being aimed for. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kall Konnect" />

    <!-- Paints the app's real background the instant the browser has the
         HTML - before the JS bundle loads, parses, or mounts React - so
         there's no flash of stark white ahead of the SplashScreen. Values
         are duplicated from index.css's --background (light/dark), since
         nothing from that stylesheet is available yet at this point. -->
    <style>
      html, body, #root { background-color: hsl(26 100% 97%); }
      html.dark, html.dark body, html.dark #root { background-color: hsl(220 20% 12%); }
    </style>
    <script>
      // Applies the "dark" class before first paint, matching next-themes'
      // own storage key/logic (ThemeProvider in App.tsx), so the background
      // color set above is the *correct* one immediately instead of
      // guessing light and flashing to dark once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
